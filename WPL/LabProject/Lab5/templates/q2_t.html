<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Promotion Eligibility Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .result-box { 
            font-size: 1.5rem; 
            font-weight: bold;
            min-height: 60px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="#">Lab 5</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/lab5/q1/">Q1: Student Form</a>
      <a class="nav-link" href="/lab5/q2/">Q2: Promotion Check</a>
    </div>
  </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">HR Portal: Promotion Check</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="emp_id" class="form-label">Select Employee ID:</label>
                            <select class="form-select" name="emp_id" required>
                                <option selected disabled value="">Choose an ID...</option>
                                <option value="EMP001">EMP001</option>
                                <option value="EMP002">EMP002</option>
                                <option value="EMP003">EMP003</option>
                                <option value="EMP004">EMP004</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="doj" class="form-label">Date of Joining:</label>
                            <input type="date" class="form-control" name="doj" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">Am I Eligible for Promotion?</button>
                        </div>
                    </form>

                    {% if result %}
                    <hr class="my-4">
                    <div class="text-center">
                        <p class="text-muted mb-1">Eligibility Status:</p>
                        <span class="badge rounded-pill 
                            {% if result == 'YES' %}bg-success{% else %}bg-danger{% endif %} 
                            result-box d-inline-flex align-items-center px-4">
                            {{ result }}
                        </span>
                    </div>
                    {% endif %}
                    
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
