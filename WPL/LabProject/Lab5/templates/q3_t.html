<!DOCTYPE html>
<html>
<head>
    <title>Captcha Page</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }
        .captcha-box {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            background: #f0f0f0;
            display: inline-block;
            padding: 10px 20px;
        }
        input[disabled] {
            background-color: #ddd;
        }
    </style>
</head>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="#">Lab 5</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/lab5/q1/">Q1: Student Form</a>
      <a class="nav-link" href="/lab5/q2/">Q2: Promotion Check</a>
      <a class="nav-link" href="/lab5/q3/">Q3: Captcha Validation</a>
    </div>
  </div>
</nav>
<body>
<h2>Captcha Verification</h2>

<div class="captcha-box">
    {{ captcha }}
</div>

<form method="post">
    {% csrf_token %}
    <br><br>
    <input type="text" name="captcha_input"
           {% if disabled %}disabled{% endif %}
           required>
    <br><br>
    <button type="submit" {% if disabled %}disabled{% endif %}>
        Submit
    </button>
</form>

{% if result %}
    <p>{{ result }}</p>
{% endif %}

<p>Attempts: {{ attempts }}/3</p>

</body>
</html>
